<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<script>try{const t=localStorage.getItem('ds-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<title>Table — Design System Contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"><script type="module" src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/+esm"></script><link rel="stylesheet" href="style.css">
</head><body><div id="nav-mount"></div><div class="layout"><div id="sidebar-mount"></div><main class="main"><div class="wrap" id="table-mount" aria-busy="true"></div></main></div><script src="app.js"></script><script>
fetch('index.html').then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');const section=doc.getElementById('table');section.hidden=false;const mount=document.getElementById('table-mount');mount.replaceChildren(section);mount.setAttribute('aria-busy','false');const source=[...doc.scripts].find(s=>s.textContent.includes("const root=document.getElementById('table-play')"));if(source){const live=document.createElement('script');live.textContent=source.textContent;document.body.append(live);}}).catch(()=>{document.getElementById('table-mount').textContent='Table content could not be loaded.'});
</script></body></html>
